# 1. LOAD THE MODULE HERE (MUST BE THE FIRST LINE)
load_module modules/ngx_rtmp_module.so;

worker_processes auto;
rtmp_auto_push on;
events {}

rtmp {
    server {
        # Listen on all interfaces (IPv4 only - IPv6 causes conflicts in Docker)
        listen 1935;

        application live {
            live on;
            record off;
            
            # HLS settings
            hls on;
            hls_path /var/www/html/hls;
            hls_fragment 3;
            hls_playlist_length 60;
            
            allow publish all;
            allow play all;
            
            # 2. IMPORTANT: Inside Docker, 'localhost' refers to Nginx itself.
            # If your Node app is in the same container, localhost:3000 works.
            # If they are separate containers, use the service name (e.g., http://chat-app:3000)
            on_publish http://localhost:3000/stream/start;
            on_publish_done http://localhost:3000/stream/stop;
        }
    }
}

http {
    include       mime.types; # Good practice to include standard types
    default_type  application/octet-stream;
    
    sendfile off;
    tcp_nopush on;
    directio 512;
    
    server {
        listen 80;
        
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var/www/html;
            
            # CORS headers - restrict to same origin in production
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin $http_origin;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS';
            add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept';
            
            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin;
                add_header Access-Control-Allow-Methods 'GET, OPTIONS';
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain charset=UTF-8';
                add_header Content-Length 0;
                return 204;
            }
        }
        
        location / {
            root /var/www/html;
        }
    }
}